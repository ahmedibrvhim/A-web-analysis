<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>A | Lower Third</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ── NAV BRANDING (same as home.html) ── */
.nav-logo .logo-mark {
  font-size:16px; letter-spacing:1px; white-space:nowrap;
}
.nav-logo .logo-tag { display:block; }
body.lang-ar .nav-logo .logo-mark { font-family:'Tajawal',sans-serif; font-weight:700; }

/* ── MOBILE NAV (same as home.html) ── */
.hamburger {
  display: none; flex-direction: column; justify-content: center;
  gap: 5px; background: none; border: 1px solid var(--blood);
  padding: 8px 10px; cursor: pointer; margin-left: auto; flex-shrink: 0;
}
.hamburger span { display: block; width: 22px; height: 2px; background: var(--blood); transition: all .3s; }
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

@media (max-width: 768px) {
  nav { flex-wrap: wrap; padding: 0 14px; gap: 0; height: auto; min-height: 58px; }
  .nav-logo { padding: 10px 0; flex: 1; }
  .hamburger { display: flex; }
  .nav-links { display: none; flex-direction: column; width: 100%; order: 3; border-top: 1px solid var(--border); padding: 8px 0; gap: 0; }
  .nav-links.mobile-open { display: flex; }
  .nav-links li { width: 100%; }
  .nav-links a { display: block; padding: 12px 4px; border-bottom: 1px solid rgba(255,255,255,.04); font-size: 10px; letter-spacing: 3px; }
  .nav-right { display: none; flex-direction: column; width: 100%; order: 4; padding: 10px 0 14px; gap: 8px; border-top: 1px solid var(--border); }
  .nav-right.mobile-open { display: flex; }
  .btn-ghost { width: 100%; text-align: center; justify-content: center; }
  .user-pill { flex-wrap: wrap; width: 100%; gap: 8px; }
}

/* ── layout ── */
#toolWrap{max-width:720px;margin:0 auto;padding:0 20px 100px}
.tool-progress{display:flex;align-items:center;justify-content:center;gap:8px;padding:34px 0 6px}
.tool-dot{width:7px;height:7px;border-radius:50%;background:var(--smoke);transition:all .3s}
.tool-dot.active{background:var(--crimson);box-shadow:0 0 10px var(--crimson);width:22px;border-radius:4px}
.tool-dot.done{background:var(--blood)}
.tool-step{display:none}
.tool-step.active{display:block;animation:stepIn .45s ease}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tool-eyebrow{font-size:9px;letter-spacing:5px;color:var(--blood);text-transform:uppercase;text-align:center;margin-bottom:10px}
.tool-title{font-family:'Cinzel Decorative',cursive;font-size:clamp(20px,3.6vw,28px);color:var(--white);letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:14px}
.tool-text{font-size:12px;color:var(--text);line-height:1.9;text-align:center;max-width:480px;margin:0 auto 34px}
.tool-nav{display:flex;gap:14px;justify-content:center;margin-top:28px}
.tool-nav button:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.tool-hint{text-align:center;font-size:10px;letter-spacing:1px;color:var(--ash);margin-top:16px}
.msg-bar{padding:11px 16px;font-size:10px;letter-spacing:1px;text-align:center;margin-bottom:18px;border:1px solid transparent;display:none}
.msg-bar.error{display:block;background:rgba(220,20,60,.08);border-color:var(--blood);color:#ff8080}
.msg-bar.info{display:block;background:rgba(139,0,0,.06);border-color:var(--smoke);color:var(--bone)}

/* ── uploader ── */
.uploader{border:1.5px dashed var(--smoke);background:var(--panel);padding:54px 24px;text-align:center;cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center}
.uploader:hover,.uploader.drag{border-color:var(--blood);background:rgba(139,0,0,.07)}
.uploader-icon{width:64px;height:64px;border-radius:50%;margin-bottom:18px;display:flex;align-items:center;justify-content:center;background:rgba(139,0,0,.1);border:1px solid var(--smoke)}
.uploader-icon svg{width:26px;height:26px;color:var(--crimson)}
.uploader-cta{font-size:11px;letter-spacing:1px;color:var(--text);line-height:1.7;margin-bottom:6px}
.uploader-cta .browse-word{color:var(--crimson);text-decoration:underline;text-underline-offset:3px}
.uploader-sub{font-size:8px;letter-spacing:2px;color:var(--ash);text-transform:uppercase}
.uploader input{display:none}
.upload-preview{border:1px solid var(--border);background:var(--panel);overflow:hidden}
.upload-preview-img-wrap{position:relative;width:100%;aspect-ratio:3/4;max-height:420px;margin:0 auto;background:var(--black);display:flex;align-items:center;justify-content:center;overflow:hidden}
.upload-preview-img-wrap img{display:block;width:100%;height:100%;object-fit:contain}
.upload-preview-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--border)}
.upload-preview-name{font-size:9px;letter-spacing:.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}


/* ── validation verdict ── */
.verdict{margin-top:18px;border:1px solid var(--border);background:var(--panel);padding:20px 20px 18px;text-align:left}
.verdict.ok{border-color:#0a5;background:rgba(0,160,90,.05)}
.verdict.bad{border-color:var(--blood);background:rgba(220,20,60,.06)}
.verdict-head{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.verdict.ok .verdict-head{color:#5ecb96}
.verdict.bad .verdict-head{color:#ff8080}
.verdict p{font-size:11px;line-height:1.8;color:var(--text);margin-bottom:8px}
.verdict-stats{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0 4px;direction:ltr}
.verdict-stat .val{font-size:16px;color:var(--white);font-weight:700}
.verdict-stat .lbl{font-size:8px;letter-spacing:2px;color:var(--ash);text-transform:uppercase;margin-top:3px}
.verdict-steps{margin:10px 0 0;padding-left:18px;font-size:11px;line-height:1.9;color:var(--text)}
.verdict-refs{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:9px;line-height:1.8;color:var(--ash);letter-spacing:.3px}
.verdict-loading{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.mini-spinner{width:20px;height:20px;border:2px solid var(--smoke);border-top-color:var(--blood);border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.tool-nav{display:flex;gap:14px;justify-content:center;margin-top:22px}
.tool-nav button:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.next-panel{border:1px dashed var(--smoke);background:var(--panel);padding:60px 24px;text-align:center;font-size:10px;letter-spacing:3px;color:var(--ash);text-transform:uppercase}


/* ── STEP 2 · landmark review ── */
#step2{display:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#step2.active{display:block;animation:stepIn .45s ease}
.lm-stage{position:relative;background:#000;border:1px solid var(--border);display:flex;justify-content:center;overflow:hidden}
.lm-stage canvas{display:block;max-width:100%;pointer-events:none;user-select:none;-webkit-user-select:none}
.lm-busy{position:absolute;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;gap:12px;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.lm-ref{margin:0 auto 18px;max-width:560px;border:1px solid var(--border);background:var(--panel);overflow:hidden}
.lm-ref-main{background:#fff;line-height:0}
.lm-ref-main img{display:block;width:100%;height:auto}
.lm-ref-thumbs{display:flex;gap:8px;justify-content:center;padding:10px 10px 0;direction:ltr}
.lm-ref-thumbs button{width:92px;padding:0;border:1px solid var(--border);background:#fff;cursor:pointer;opacity:.55;line-height:0;transition:all .2s}
.lm-ref-thumbs button img{display:block;width:100%;height:58px;object-fit:cover;object-position:top}
.lm-ref-thumbs button:hover{opacity:.85}
.lm-ref-thumbs button.on{opacity:1;border-color:var(--crimson);box-shadow:0 0 10px rgba(220,20,60,.3)}
.lm-ref-cap{margin:0;padding:8px 12px 10px;font-size:9px;letter-spacing:.5px;line-height:1.7;color:var(--ash);text-align:center}
.lm-chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px;direction:ltr}
.lm-chip{position:relative;padding:11px 2px;font-size:12px;font-weight:700;letter-spacing:1px;line-height:1.2;text-align:center;color:var(--text);background:var(--panel);border:1px solid var(--border);cursor:pointer;font-family:inherit;transition:all .2s}
.lm-chip.lower{border-bottom:2px solid var(--blood)}
.lm-chip:hover{border-color:var(--blood)}
.lm-chip.sel{border-color:var(--crimson);background:rgba(139,0,0,.16);color:var(--white);box-shadow:0 0 14px rgba(220,20,60,.25)}
.lm-chip.seen::after{content:'';position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:#5ecb96}
.lm-chip bdi{unicode-bidi:isolate}
.lm-name{margin:14px 0 0;text-align:center;font-size:11px;letter-spacing:1px;color:var(--white);font-weight:700}
.lm-desc{min-height:3.2em;margin:4px auto 0;max-width:460px;text-align:center;font-size:11px;line-height:1.8;color:var(--bone)}
.lm-note{margin:6px auto 0;max-width:460px;text-align:center;font-size:9px;letter-spacing:.5px;line-height:1.8;color:var(--ash)}
.lm-dash{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px;padding:20px 16px;border:1px solid var(--border);background:var(--panel);direction:ltr}
.lm-cap{font-size:8px;letter-spacing:2px;color:var(--ash);text-transform:uppercase;margin-top:7px}
.lm-pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:5px}
.lm-pad button{touch-action:none;-webkit-touch-callout:none;display:flex;align-items:center;justify-content:center;background:rgba(139,0,0,.12);border:1px solid var(--smoke);color:var(--crimson);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:background .15s,border-color .15s}
.lm-pad button:hover{border-color:var(--crimson)}
.lm-pad button:active,.lm-pad button.hold{background:var(--blood);color:var(--white);border-color:var(--crimson)}
.lm-pad svg{width:20px;height:20px}
.lm-pad .c{display:flex;align-items:center;justify-content:center}
.lm-pad .c i{width:5px;height:5px;border-radius:50%;background:var(--smoke)}
.lm-side{display:flex;flex-direction:column;gap:12px;min-width:150px;direction:inherit}
html[dir=rtl] .lm-side{direction:rtl}
.lm-seg{display:flex;border:1px solid var(--smoke)}
.lm-seg button{flex:1;padding:8px 6px;font-size:9px;letter-spacing:1px;background:none;border:0;color:var(--ash);cursor:pointer;font-family:inherit}
.lm-seg button+button{border-inline-start:1px solid var(--smoke)}
.lm-seg button.on{background:var(--blood);color:var(--white)}
.lm-side .btn-ghost{width:100%;text-align:center;justify-content:center}
.lm-progress{text-align:center;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:16px;text-transform:uppercase}
@media (max-width:520px){.lm-dash{gap:16px}.lm-chip{font-size:11px;letter-spacing:0}}


/* ── gender gate ── */
.gender-box{margin-bottom:22px;text-align:center}
.gender-box .gb-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--white);margin-bottom:8px}
.gender-box .gb-text{font-size:11px;line-height:1.8;color:var(--text);max-width:440px;margin:0 auto 16px}
.gender-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:380px;margin:0 auto}
.gender-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px 14px;background:var(--panel);border:1px solid var(--border);color:var(--text);cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:all .25s}
.gender-btn .sym{font-size:30px;line-height:1;color:var(--ash);transition:color .25s}
.gender-btn:hover{border-color:var(--blood)}
.gender-btn.on{border-color:var(--crimson);background:rgba(139,0,0,.18);color:var(--white);box-shadow:0 0 16px rgba(220,20,60,.25)}
.gender-btn.on .sym{color:var(--crimson)}
.uploader.locked{opacity:.35;pointer-events:none;filter:grayscale(1)}
.lock-hint{text-align:center;font-size:10px;letter-spacing:1px;color:var(--ash);margin:-8px 0 0}

/* ── STEP 3 · analysis ── */
#step3{display:none}
#step3.active{display:block;animation:stepIn .45s ease}
#s3Stage{padding:0}
.s3-cal{margin-top:14px;padding:14px 16px;border:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:8px}
.s3-cal label{font-size:9px;letter-spacing:2px;color:var(--ash);text-transform:uppercase;text-align:center}
.s3-cal input{width:130px;padding:9px 10px;text-align:center;font-size:13px;font-family:inherit;color:var(--white);background:var(--black);border:1px solid var(--smoke);outline:none;direction:ltr}
.s3-cal input:focus{border-color:var(--crimson)}
.s3-cal .lm-note{margin:0}
.s3-card{margin-top:16px;padding:18px 18px 16px;border:1px solid var(--border);background:var(--panel)}
.s3-h{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--white);margin-bottom:14px}
.s3-tbl{width:100%;border-collapse:collapse;font-size:11px;color:var(--text)}
.s3-tbl th{font-size:8px;letter-spacing:2px;color:var(--ash);text-transform:uppercase;font-weight:400;padding:0 6px 8px;text-align:start}
.s3-tbl td{padding:9px 6px;border-top:1px solid var(--border);vertical-align:middle}
.s3-tbl td.v{direction:ltr;text-align:start;color:var(--white);font-weight:700;white-space:nowrap}
.s3-tbl td.i{direction:ltr;text-align:start;color:var(--ash);white-space:nowrap}
.s3-chip{display:inline-block;padding:3px 8px;font-size:9px;letter-spacing:1px;border:1px solid;white-space:nowrap}
.s3-chip.ok{color:#5ecb96;border-color:#0a5;background:rgba(0,160,90,.08)}
.s3-chip.warn{color:#ffc933;border-color:#8a6d00;background:rgba(255,201,51,.07)}
.s3-chip.bad{color:#ff8080;border-color:var(--blood);background:rgba(220,20,60,.08)}
.s3-bar{display:flex;height:24px;margin:14px 0 4px;direction:ltr;border:1px solid var(--border)}
.s3-bar span{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#000;overflow:hidden;white-space:nowrap}
.s3-bar-cap{font-size:8px;letter-spacing:2px;color:var(--ash);text-transform:uppercase;margin-top:10px}
.s3-p{font-size:11px;line-height:1.85;color:var(--text);margin:10px 0 0}
.s3-p.dim{color:var(--ash);font-size:10px}
.s3-tier{text-align:center;padding:6px 0 4px}
.s3-tier .name{font-family:'Cinzel Decorative',cursive;font-size:clamp(26px,6vw,38px);letter-spacing:3px;color:var(--crimson);text-shadow:0 0 18px rgba(220,20,60,.35)}
.s3-tier .score{font-size:11px;letter-spacing:2px;color:var(--white);margin-top:6px;direction:ltr}
.s3-tier .desc{font-size:11px;line-height:1.8;color:var(--bone);max-width:460px;margin:10px auto 0}
.s3-sub{font-size:9px;letter-spacing:3px;color:var(--blood);text-transform:uppercase;margin:16px 0 6px}
.s3-sub:first-of-type{margin-top:0}
.s3-list{margin:0;padding-inline-start:18px;font-size:11px;line-height:1.85;color:var(--text)}
.s3-list li{margin-bottom:5px}
.s3-disc{text-align:center;font-size:9px;line-height:1.8;letter-spacing:.4px;color:var(--ash);max-width:480px;margin:16px auto 0}
#step3 .tool-nav{flex-wrap:wrap}
.s3-dev{margin-top:16px;border:1px dashed var(--smoke);background:var(--panel);padding:12px 16px;direction:ltr;text-align:left}
.s3-dev summary{cursor:pointer;font-size:9px;letter-spacing:2px;color:var(--ash);text-transform:uppercase}
.s3-dev .dbg{font-size:10px;display:block;overflow-x:auto;margin-bottom:6px}.s3-dev .dbg td,.s3-dev .dbg th{white-space:nowrap}

/* ── auth gate ── */
.auth-gate{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at center,#150000 0%,#000 70%);display:flex;align-items:center;justify-content:center;transition:opacity .3s,visibility .3s}
.auth-gate.auth-gate-hidden{opacity:0;visibility:hidden;pointer-events:none}
.auth-gate-inner{text-align:center}
.auth-gate-skull{width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid var(--blood);box-shadow:0 0 30px rgba(139,0,0,.4);margin:0 auto 16px;display:block}
.auth-gate-text{font-family:'Cinzel',serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-gate-inner">
    <img src="Skull.png" alt="" class="auth-gate-skull">
    <div class="auth-gate-text" data-i18n="auth_gate_checking">Checking your session…</div>
  </div>
</div>

<nav>
  <a class="nav-logo" href="index.html">
    <img src="Skull.png" alt="Lower Third">
    <div>
      <div class="logo-mark" data-i18n="brand_name">Lower Third</div>
      <div class="logo-tag" data-i18n="brand_tag">Calculator</div>
    </div>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html" data-i18n="nav_home">Home</a></li>
    <li><a href="privacy-policy.html" data-i18n="nav_privacy">Privacy Policy</a></li>
  </ul>
  <button class="hamburger" id="hamburger" onclick="toggleMobileNav()" aria-label="Menu"><span></span><span></span><span></span></button>
  <div class="nav-right" id="navRight">
    <button class="nav-lang" id="navLang" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <span><span class="lang-cur" id="langCur">EN</span> <span class="lang-sep">/</span> <span id="langOther">AR</span></span>
    </button>
  </div>
</nav>

<div class="page-wrap">
<div id="toolWrap">
  <div class="msg-bar" id="toolMsg"></div>

  <div class="gender-box" id="genderBox">
    <div class="gb-title" data-i18n="g_title">Select Your Gender</div>
    <p class="gb-text" data-i18n="g_text"></p>
    <div class="gender-opts" role="group">
      <button type="button" class="gender-btn" data-g="male" aria-pressed="false"><span class="sym">♂</span><span data-i18n="g_male">Male</span></button>
      <button type="button" class="gender-btn" data-g="female" aria-pressed="false"><span class="sym">♀</span><span data-i18n="g_female">Female</span></button>
    </div>
  </div>
  <p class="lock-hint" id="lockHint" data-i18n="g_locked"></p>

  <label class="uploader locked" id="uploader">
    <input type="file" accept="image/*" id="fileInput" disabled>
    <span class="uploader-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span>
    <p class="uploader-cta" id="uploaderCta"></p>
    <p class="uploader-sub">JPG · PNG · HEIC</p>
  </label>
  <div class="upload-preview" id="previewBox" style="display:none">
    <div class="upload-preview-img-wrap"><img id="previewImg" alt="Photo preview"></div>
    <div class="upload-preview-bar">
      <span class="upload-preview-name" id="fileName"></span>
      <button class="btn-ghost" id="changeBtn" type="button" data-i18n="tool_change_photo">Change Photo</button>
    </div>
  </div>
  <div class="verdict" id="verdict" style="display:none"></div>
  <div class="tool-nav" id="continueNav" style="display:none">
    <button class="btn-solid" id="continueBtn" type="button" disabled data-i18n="tool_continue">Continue →</button>
  </div>

  <section id="step2" aria-live="polite">
    <div class="tool-eyebrow" data-i18n="s2_eyebrow">Step 2 · Landmarks</div>
    <h2 class="tool-title" data-i18n="tool_step_adjust_title">Confirm The Landmarks</h2>
    <p class="tool-text" style="margin-bottom:22px" data-i18n="s2_text"></p>
    <figure class="lm-ref" id="lmRef">
      <div class="lm-ref-main"><img id="lmRefImg" src="landmark-reference-labeled.png" alt="Landmark reference with the six points Tr, N, Sn, Ls, Li, Me"></div>
      <div class="lm-ref-thumbs">
        <button type="button" class="on" data-src="landmark-reference-labeled.png" data-cap="tool_ref_cap_dots" aria-label="Landmark points"><img src="landmark-reference-labeled.png" alt=""></button>
        <button type="button" data-src="thirds.jpeg" data-cap="tool_ref_cap_thirds" aria-label="Facial thirds"><img src="thirds.jpeg" alt=""></button>

<script type="module">
import { auth, onAuthStateChanged, signOut } from './firebase-config.js';
import * as FA from './engine.js';
import { getLang, applyDocumentDirection, applyTranslations, wireLangToggle, t } from './i18n.js';

const $ = id => document.getElementById(id);

/* ── AUTH ── */
function renderUserPill(user) {
  const avatar = (user.photoURL && user.photoURL.startsWith('http')) ? user.photoURL : 'Skull.png';
  const stored = JSON.parse(localStorage.getItem('brandA_user') || '{}');

  $('navRight').innerHTML =
    '<button class="nav-lang" id="navLang" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span><span class="lang-cur" id="langCur">EN</span> <span class="lang-sep">/</span> <span id="langOther">AR</span></span></button>' +
    '<div class="user-pill"><img class="user-avatar" id="navAvatarImg"><span class="user-name"></span><button class="btn-logout" id="logoutBtn"></button></div>';
  document.querySelector('.user-name').textContent = name;
  $('logoutBtn').textContent = t('sign_out', lang);
  const img = $('navAvatarImg');
  img.src = avatar; img.onerror = function () { this.onerror = null; this.src = 'Skull.png'; };
  $('logoutBtn').onclick = () => signOut(auth).then(() => { localStorage.removeItem('brandA_user'); location.href = 'home.html'; });
  wireLangToggle($('navLang'), lang, onLangChange);
}
onAuthStateChanged(auth, user => {
  if (!user) { sessionStorage.setItem('authRequired', '1'); location.href = 'login.html'; return; }
  renderUserPill(user);
  $('authGate').classList.add('auth-gate-hidden');
});

/* ── I18N ── */
let lang = getLang();
applyDocumentDirection(lang);
applyTranslations(lang);
function renderStatic() {
  $('uploaderCta').innerHTML = `${t('tool_drop_prefix', lang)} <span class="browse-word">${t('tool_drop_browse', lang)}</span>`;
  const lb = $('logoutBtn'); if (lb) lb.textContent = t('sign_out', lang);
}
function onLangChange(next) { lang = next; applyDocumentDirection(next); applyTranslations(next); renderStatic(); if (validation && $('previewBox').style.display !== 'none') renderVerdict(validation); renderStep2(); if ($('step3').classList.contains('active')) renderS3(); }
wireLangToggle($('navLang'), lang, onLangChange);
window.toggleMobileNav = () => {
  ['hamburger', 'navLinks', 'navRight'].forEach(id => $(id).classList.toggle(id === 'hamburger' ? 'open' : 'mobile-open'));
};
$('navLinks').addEventListener('click', e => {
  if (e.target.tagName === 'A') ['hamburger', 'navLinks', 'navRight'].forEach(id => $(id).classList.remove('open', 'mobile-open'));
});
renderStatic();

/* ── FACE ANALYSIS (runs fully in the browser with MediaPipe) ── */
const T = (key, params = {}) => t(key, lang).replace(/\{(\w+)\}/g, (_, k) => params[k] ?? '');
const RULES = {
  yawMax: FA.CONFIG.pose.yawReject,    // deg — hard reject (confidence already decays from FA.CONFIG.pose.soft)
  pitchMax: FA.CONFIG.pose.pitchReject,
  rollLevel: 0.5    // deg — below this the pupillary line counts as already level
};
let landmarker = null, modelFailed = false;
async function getLandmarker() {
  if (landmarker || modelFailed) return landmarker;
  try {
    const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const vision = await import(base + '/vision_bundle.mjs');
    const files = await vision.FilesetResolver.forVisionTasks(base + '/wasm');
    landmarker = await vision.FaceLandmarker.createFromOptions(files, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'IMAGE',
      numFaces: 2,                                  // 2 so a second person can be caught
      outputFacialTransformationMatrixes: true,
      outputFaceBlendshapes: true                  // expression control (smile / jaw open / brows / squint)
    });
  } catch (e) { console.error('MediaPipe load failed', e); modelFailed = true; landmarker = null; }
  return landmarker;
}

// Pupil centers in pixels + the line angle vs true horizontal.
// Image y points down, so a positive angle = line slopes down to the right (visually clockwise).
function pupils(lm, w, h) {
  const hasIris = lm.length > 473;
  const A = hasIris ? lm[468] : lm[33], B = hasIris ? lm[473] : lm[263];
  const [L, R] = A.x <= B.x ? [A, B] : [B, A];     // L = left in the picture
  const l = { x: L.x * w, y: L.y * h }, r = { x: R.x * w, y: R.y * h };
  return { angle: Math.atan2(r.y - l.y, r.x - l.x) * 180 / Math.PI, mid: { x: (l.x + r.x) / 2, y: (l.y + r.y) / 2 } };
}

// Level the photo (rotate so the pupil line is horizontal), then crop to head + hair.
// The mesh only covers the face (forehead→chin), so the box is the face extents padded for hair/ears.
const CROP = { top: 0.5, bottom: 0.12, side: 0.32, aspect: 4 / 5, maxSide: 1600 };
function levelAndCrop(img, lm, rollDeg, pivot) {
  const W = img.naturalWidth, H = img.naturalHeight, r = rollDeg * Math.PI / 180;
  const cos = Math.cos(r), sin = Math.sin(r);
  // landmarks in the LEVELED frame: rotate by -roll around the pivot
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  lm.forEach(p => {
    const dx = p.x * W - pivot.x, dy = p.y * H - pivot.y;
    const x = pivot.x + dx * cos + dy * sin, y = pivot.y - dx * sin + dy * cos;
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  });
  const fw = x1 - x0, fh = y1 - y0, cx = (x0 + x1) / 2;
  const top = y0 - fh * CROP.top, bottom = y1 + fh * CROP.bottom;
  let h = bottom - top, w = Math.max(fw * (1 + 2 * CROP.side), h * CROP.aspect);
  h = Math.max(h, w / CROP.aspect);
  const bx = cx - w / 2, by = top - (h - (bottom - top)) / 2;
  const k = Math.min(1, CROP.maxSide / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const g = c.getContext('2d');
  g.fillStyle = '#0b0b0b'; g.fillRect(0, 0, c.width, c.height);   // only visible if the box leaves the photo
  g.scale(k, k); g.translate(-bx, -by);
  g.translate(pivot.x, pivot.y); g.rotate(-r); g.translate(-pivot.x, -pivot.y);
  g.drawImage(img, 0, 0);
  return c.toDataURL('image/jpeg', 0.92);
}

async function analyze(img) {
  const lmk = await getLandmarker();
  if (!lmk) return { error: 'tv_err_model' };
  let res;
  try { res = lmk.detect(img); } catch (e) { console.error(e); return { error: 'tv_err_analyze' }; }
  const faces = res?.faceLandmarks?.length || 0;

  // 1. Object detection & strict compliance
  if (faces !== 1) return { ok: false, head: ['tv_rej_human'], reason: [faces === 0 ? 'tv_rej_human_none' : 'tv_rej_human_multi'] };

  const pz = FA.poseFromMatrix(res.facialTransformationMatrixes?.[0]?.data);
  if (!pz) return { error: 'tv_err_pose' };
  const yaw = pz.yaw, pitch = pz.pitch;
  const lm = res.faceLandmarks[0];
  const facePx = (Math.max(...lm.slice(0, 468).map(p => p.y)) - Math.min(...lm.slice(0, 468).map(p => p.y))) * img.naturalHeight;
  const eyes = pupils(lm, img.naturalWidth, img.naturalHeight);
  const roll = eyes.angle, abs = Math.abs(roll);
  const stats = { yaw, roll, pitch };

  if (Math.abs(yaw) > RULES.yawMax) return { ok: false, stats, head: ['tv_rej_front'],
    reason: ['tv_rej_front_why', { deg: Math.abs(yaw).toFixed(1), max: RULES.yawMax }] };
  if (Math.abs(pitch) > RULES.pitchMax) return { ok: false, stats, head: ['tv_rej_front'],
    reason: ['tv_rej_front_why', { deg: Math.abs(pitch).toFixed(1), max: RULES.pitchMax }] };

  // 2. Smart geometric correction — actually applied to the image
  const level = abs < RULES.rollLevel;
  const deg = abs.toFixed(1);
  const steps = level
    ? [['tv_step_level', { deg: roll.toFixed(2) }]]
    : [['tv_step1'], ['tv_step2', { deg }], ['tv_step3', { deg, dir: roll > 0 ? 'tv_ccw' : 'tv_cw' }], ['tv_step4']];
  return { ok: true, stats, steps, level, pose: { yaw, pitch, roll: 0 }, facePx,
    cropUrl: levelAndCrop(img, lm, level ? 0 : roll, eyes.mid),
    correctionDeg: level ? 0 : -roll,
    head: ['tv_ok_head'], reason: level ? ['tv_ok_level'] : ['tv_ok_tilt', { deg }] };
}

const txt = a => T(a[0], a[1] ? Object.fromEntries(Object.entries(a[1]).map(([k, v]) => [k, (k === 'dir') ? T(v) : v])) : {});
function renderVerdict(r) {
  const box = $('verdict');
  box.style.display = 'block';
  const esc = v => String(v).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  if (r.error) {
    box.className = 'verdict bad';
    box.innerHTML = `<div class="verdict-head">${esc(T('tv_failed'))}</div><p>${esc(T(r.error))}</p>`;
    return;
  }
  box.className = 'verdict ' + (r.ok ? 'ok' : 'bad');
  box.innerHTML = `<div class="verdict-head">${esc(txt(r.head))}</div><p>${esc(txt(r.reason))}</p>`;
  if (r.ok) { $('continueNav').style.display = 'flex'; $('continueBtn').disabled = false; }
}

/* ── GENDER GATE (must be chosen before a photo can be picked) ── */
let gender = null;   // 'male' | 'female'
function setGender(g) {
  gender = g;
  document.querySelectorAll('.gender-btn').forEach(b => { const on = b.dataset.g === g; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  $('uploader').classList.remove('locked');
  $('fileInput').disabled = false;
  $('lockHint').style.display = 'none';
  showMsg('');
  if ($('step3').classList.contains('active')) renderS3();
}
document.querySelectorAll('.gender-btn').forEach(b => b.addEventListener('click', () => setGender(b.dataset.g)));

/* ── UPLOADER ── */
let currentImage = null;   // HTMLImageElement of the uploaded photo
let validation = null;     // last verdict — { ok, stats, correctionDeg, cropUrl, cropped (leveled Image), ... }

function showMsg(key) {
  const el = $('toolMsg');
  el.textContent = key ? T(key) : '';
  el.className = 'msg-bar' + (key ? ' error' : '');
}
function loadImage(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function resetVerdict() {
  validation = null;
  $('verdict').style.display = 'none';
  $('continueNav').style.display = 'none';
  $('continueBtn').disabled = true;
}
async function handleFile(file) {
  if (!gender) { showMsg('g_err'); return; }
  if (!file || !file.type.startsWith('image/')) { showMsg('tv_err_not_image'); return; }
  let img;
  try { img = await loadImage(URL.createObjectURL(file)); }
  catch (e) { showMsg('tv_err_read'); return; }
  currentImage = img; resetVerdict(); s2 = null;
  $('previewImg').src = img.src;
  $('fileName').textContent = file.name;
  $('uploader').style.display = 'none';
  $('previewBox').style.display = 'block';
  showMsg('');

  const box = $('verdict');
  box.className = 'verdict'; box.style.display = 'block';
  box.innerHTML = `<div class="verdict-loading"><span class="mini-spinner"></span>${T('tv_analyzing')}</div>`;
  const r = await analyze(img);
  if (img !== currentImage) return;            // user swapped the photo mid-analysis
  validation = r;
  if (r.ok && r.cropUrl) { $('previewImg').src = r.cropUrl; try { r.cropped = await loadImage(r.cropUrl); } catch (e) {} }
  renderVerdict(r);
}
$('fileInput').addEventListener('change', e => handleFile(e.target.files[0]));
$('changeBtn').addEventListener('click', () => {
  currentImage = null; resetVerdict(); s2 = null;
  $('fileInput').value = '';
  $('uploader').style.display = 'flex';
  $('previewBox').style.display = 'none';
  $('fileInput').click();
});
$('continueBtn').addEventListener('click', () => {
  if (!validation?.ok) return;
  $('previewBox').style.display = 'none';
  $('continueNav').style.display = 'none';
  $('verdict').style.display = 'none';
  $('genderBox').style.display = 'none';
  openStep2();
  scrollTo({ top: 0, behavior: 'smooth' });
});
const up = $('uploader');
['dragenter', 'dragover'].forEach(ev => up.addEventListener(ev, e => { e.preventDefault(); up.classList.add('drag'); }));
['dragleave', 'drop'].forEach(ev => up.addEventListener(ev, e => { e.preventDefault(); up.classList.remove('drag'); }));
up.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));

/* ══════════════════════════════════════════════════════════
   STEP 2 · LANDMARK REVIEW
   Six points: Tr, N (facial thirds) + Sn, Ls, Li, Me (lower third).
   Points are auto-placed from the face mesh and can ONLY be moved
   with the arrow pad (or keyboard arrows) — never dragged or clicked.
══════════════════════════════════════════════════════════ */
const LM = [
  { id: 'Tr', pt: 'tool_pt_tr', desc: 'tool_guide_desc_tr' },
  { id: 'N',  pt: 'tool_pt_n',  desc: 'tool_guide_desc_n' },
  { id: 'Sn', pt: 'tool_pt_sn', desc: 'tool_guide_desc_sn', lower: true },
  { id: 'Ls', pt: 'tool_pt_ls', desc: 'tool_guide_desc_ls', lower: true },
  { id: 'Li', pt: 'tool_pt_li', desc: 'tool_guide_desc_li', lower: true },
  { id: 'Me', pt: 'tool_pt_me', desc: 'tool_guide_desc_me', lower: true }
];
const STEP_PX = { fine: 0.5, normal: 2, coarse: 8 };   // image px per 1000 px of image height
const DOT_R = 1.5;                                      // css px — deliberately tiny
let s2 = null;   // { src, img, W, H, k, dpr, pts:{id:{x,y,ax,ay,seen}}, sel, stepKey, detected, hairEst }
const nf = n => lang === 'ar' ? String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]) : String(n);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* Hairline scan: brightness step from skin to (darker) hair, up three forehead columns.
   Returns { y, contrast, spread } for the centre column or null. It only finds DARK hair against lighter skin;
   everything else (blond/light hair, dark skin, hats, shadows) is expected to fail or score low confidence
   in FA.resolveHairline — the point is then marked ESTIMATED and the user is asked to place Tr. */
function scanHairline(img, p10, p9, fw, fh) {
  try {
    const W = img.naturalWidth, H = img.naturalHeight;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0);
    const yEnd = clamp(Math.round(p9.y), 1, H - 1);
    const column = cx => {
      const band = Math.max(2, Math.round(0.035 * fw));
      const x0 = clamp(Math.round(cx - band), 0, W - 1), bw = Math.max(1, Math.min(W - x0, band * 2));
      const d = g.getImageData(x0, 0, bw, yEnd).data, col = new Float32Array(yEnd);
      for (let y = 0; y < yEnd; y++) { let sum = 0; for (let x = 0; x < bw; x++) { const k = (y * bw + x) * 4; sum += 0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2]; } col[y] = sum / bw; }
      const sm = new Float32Array(yEnd);
      for (let y = 0; y < yEnd; y++) { let a = 0, n = 0; for (let k = -2; k <= 2; k++) { const i = y + k; if (i >= 0 && i < yEnd) { a += col[i]; n++; } } sm[y] = a / n; }
      const y10 = Math.round(p10.y), yTo = yEnd - Math.round(0.05 * fh);
      if (yTo - y10 < 3) return null;
      const skinArr = Array.from(sm.slice(y10, yTo)).sort((a, b) => a - b), skin = skinArr[skinArr.length >> 1];
      if (skin < 25) return null;
      const thr = skin * 0.62, run = Math.max(3, Math.round(0.012 * fh)), top = Math.max(run, Math.round(p10.y - 0.6 * fh));
      for (let y = y10; y > top; y--) {
        let all = true; for (let k = 1; k <= run; k++) if (sm[y - k] >= thr) { all = false; break; }
        if (all) { let hs = 0; for (let k = 1; k <= run; k++) hs += sm[y - k]; return { y, contrast: (skin - hs / run) / skin }; }
      }
      return null;
    };
    const mid = column(p10.x);
    if (!mid) return null;
    const ys = [-0.10, 0.10].map(o => column(p10.x + o * fw)).filter(Boolean).map(r => r.y).concat(mid.y);
    const spread = ys.length < 3 ? FA.CONFIG.hair.spread.bad : (Math.max(...ys) - Math.min(...ys)) / fh;
    return { y: mid.y, contrast: mid.contrast, spread };
  } catch (e) { console.warn('hairline scan failed', e); }
  return null;
}

/* Image-quality sample: face box resampled to a fixed width (so blur/lighting numbers are comparable between photos). */
function sampleQuality(img, mesh, facePx) {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < 468; i++) { x0 = Math.min(x0, mesh[i].x); x1 = Math.max(x1, mesh[i].x); y0 = Math.min(y0, mesh[i].y); y1 = Math.max(y1, mesh[i].y); }
  const W = img.naturalWidth, H = img.naturalHeight, w = 160, h = Math.max(8, Math.round(w * (y1 - y0) / (x1 - x0)));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, x0, y0, x1 - x0, y1 - y0, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, luma = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) luma[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  const m = FA.CONFIG.quality.edgeMargin;
  return FA.assessQuality({ luma, w, h, facePx, meshNearEdge: x0 < m * W || y0 < m * H || x1 > (1 - m) * W || y1 > (1 - m) * H });
}

/* Upper-lip border (Ls): the mesh runs low on the upper lip, so look for the thin bright
   vermilion ridge just above the dark mouth line, on the midline. Returns null if not clear. */
function findUpperLip(img, p0, p13, p14, fw, fh) {
  try {
    const W = img.naturalWidth, H = img.naturalHeight;
    const band = Math.max(2, Math.round(0.02 * fw));
    const x0 = clamp(Math.round(p0.x - band), 0, W - 1), bw = Math.max(1, Math.min(W - x0, band * 2));
    const yA = clamp(Math.round(p0.y - 0.10 * fh), 0, H - 2), yB = clamp(Math.round(p14.y + 0.04 * fh), yA + 2, H - 1);
    const c = document.createElement('canvas'); c.width = bw; c.height = yB - yA;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, x0, yA, bw, yB - yA, 0, 0, bw, yB - yA);
    const d = g.getImageData(0, 0, bw, yB - yA).data, n = yB - yA, L = new Float32Array(n);
    for (let y = 0; y < n; y++) { let sum = 0; for (let x = 0; x < bw; x++) { const k = (y * bw + x) * 4; sum += 0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2]; } L[y] = sum / bw; }
    const sm = new Float32Array(n);
    for (let y = 0; y < n; y++) { let s = 0, m = 0; for (let k = -1; k <= 1; k++) { const i = y + k; if (i >= 0 && i < n) { s += L[i]; m++; } } sm[y] = s / m; }
    // mouth line = darkest row near the inner-lip landmarks
    const mid = (p13.y + p14.y) / 2 - yA, r = Math.round(0.04 * fh);
    let S = -1, best = Infinity;
    for (let y = Math.max(1, Math.round(mid - r)); y < Math.min(n - 1, Math.round(mid + r)); y++) if (sm[y] < best) { best = sm[y]; S = y; }
    if (S < 0) return null;
    // brightest local ridge between 1.2% and 7.5% of the face height above the mouth line
    const lo = Math.max(1, S - Math.round(0.075 * fh)), hi = S - Math.round(0.012 * fh);
    let peak = -1, pv = -Infinity, mn = Infinity;
    for (let y = lo; y <= hi; y++) {
      mn = Math.min(mn, sm[y]);
      if (sm[y] > pv && sm[y] >= sm[y - 1] && sm[y] >= sm[y + 1]) { pv = sm[y]; peak = y; }
    }
    if (peak < 0 || pv - mn < 18) return null;                // not a clear ridge → keep the fallback
    return yA + peak;
  } catch (e) { console.warn('upper-lip scan failed', e); }
  return null;
}

async function detectLandmarks(img, facePx, pose) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const lmk = await getLandmarker();
  if (lmk) {
    try {
      const res = lmk.detect(img), lm = res?.faceLandmarks?.[0];
      if (lm && lm.length >= 468) {
        const mesh = lm.map(p => ({ x: p.x * W, y: p.y * H })), P = i => mesh[i];
        const G = FA.faceGeometry(mesh), fh = G.fh, fw = G.fw;
        const mix = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
        const N = mix(P(9), P(168), 0.5);                             // brow dip, between glabella and bridge
        const hair = FA.resolveHairline(scanHairline(img, P(10), P(9), fw, fh), P(10).y, N.y, P(152).y, fh);
        const lsY = findUpperLip(img, P(0), P(13), P(14), fw, fh);
        const pts = {
          Tr: { x: P(10).x, y: hair.y },
          N,
          Sn: P(2),                                                    // base of the nose where the columella meets the lip
          Ls: { x: P(0).x, y: lsY ?? P(0).y - 0.012 * fh },             // upper-lip vermilion border (snapped to the bright ridge when clear)
          Li: P(17),                                                   // lower-lip vermilion border
          Me: P(152)                                                   // chin bottom
        };
        return { detected: true, hairEst: hair.source === 'proxy', pts,
          meta: { mesh, hair, fh, blend: res.faceBlendshapes?.[0]?.categories || null, pose,
                  quality: sampleQuality(img, mesh, facePx || fh) } };
      }
    } catch (e) { console.error(e); }
  }
  const f = (y) => ({ x: W / 2, y: H * y });                // average positions for a cropped portrait — NO mesh, so no scored analysis
  return { detected: false, hairEst: false, pts: { Tr: f(.20), N: f(.45), Sn: f(.70), Ls: f(.76), Li: f(.82), Me: f(.91) } };
}

function layoutStage() {
  if (!s2) return;
  const wrap = $('lmStage'), cv = $('lmCanvas');
  const maxW = wrap.clientWidth || 600, maxH = Math.min(innerHeight * 0.72, 780);
  const k = Math.min(maxW / s2.W, maxH / s2.H), dpr = window.devicePixelRatio || 1;
  const cw = Math.round(s2.W * k), ch = Math.round(s2.H * k);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  s2.k = k; s2.dpr = dpr;
  draw();
}

function draw() {
  if (!s2 || !s2.k) return;
  const cv = $('lmCanvas'), g = cv.getContext('2d'), sc = s2.k * s2.dpr, d = s2.dpr;
  g.clearRect(0, 0, cv.width, cv.height);
  g.drawImage(s2.img, 0, 0, s2.W * sc, s2.H * sc);
  const cur = LM[s2.sel].id, cp = s2.pts[cur];
  // faint level guide through the selected point
  g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = d; g.beginPath();
  g.moveTo(0, cp.y * sc); g.lineTo(cv.width, cp.y * sc); g.stroke();
  LM.forEach(m => {
    const p = s2.pts[m.id], x = p.x * sc, y = p.y * sc, on = m.id === cur;
    if (on) {                                               // thin ring + ticks so the tiny dot is findable
      const R = 9 * d, gap = 3 * d;
      g.strokeStyle = 'rgba(255,60,90,.9)'; g.lineWidth = d;
      g.beginPath(); g.arc(x, y, R, 0, 7); g.stroke();
      g.beginPath();
      g.moveTo(x - R - 4 * d, y); g.lineTo(x - gap, y); g.moveTo(x + gap, y); g.lineTo(x + R + 4 * d, y);
      g.moveTo(x, y - R - 4 * d); g.lineTo(x, y - gap); g.moveTo(x, y + gap); g.lineTo(x, y + R + 4 * d);
      g.stroke();
    }
    g.fillStyle = on ? '#ff3c5a' : (m.lower ? '#ffc933' : '#ffffff');
    g.strokeStyle = 'rgba(0,0,0,.75)'; g.lineWidth = .8 * d;
    g.beginPath(); g.arc(x, y, (on ? DOT_R + .3 : DOT_R) * d, 0, 7); g.fill(); g.stroke();
  });
}

function renderStep2() {

}

function pointStatus(id) {                                  // AUTO | CORRECTED | ESTIMATED | LOW
  const p = s2.pts[id], fh = s2.meta?.fh || s2.H * 0.6;
  if (Math.hypot(p.x - p.ax, p.y - p.ay) / fh > FA.CONFIG.moveTolFh) return 'corrected';
  if (id === 'Tr' && s2.hairEst) return 'estimated';
  if (id === 'Tr' && s2.meta && s2.meta.hair.confidence < 0.45) return 'low';
  return 'auto';
}
function select(i) {
  if (!s2) return;
  s2.sel = (i + LM.length) % LM.length;
  s2.pts[LM[s2.sel].id].seen = true;                        // selecting a point counts as reviewing it
  renderStep2(); draw();
}
function nudge(dx, dy, coarse) {
  if (!s2) return;
  const p = s2.pts[LM[s2.sel].id], u = s2.H / 1000;
  const step = STEP_PX[coarse ? 'coarse' : s2.stepKey] * u;
  p.x = clamp(p.x + dx * step, 0, s2.W); p.y = clamp(p.y + dy * step, 0, s2.H);
  if (!p.seen) { p.seen = true; renderStep2(); }
  draw();
}

/* ══════════════════════════════════════════════════════════
   STEP 3 · LOWER THIRD ANALYSIS
   Measures the confirmed landmarks, draws dimension lines
   (extension lines + rulers with labels) and builds the report.
   Gender picks the tier names and the fix recommendations.
══════════════════════════════════════════════════════════ */
// (no universal 'ideal' constant any more — see FA.REFERENCE_PROFILES)
const S3C = { up: '#8ab4ff', mid: '#c3a6ff', low: '#ffffff', phil: '#ffc933', lips: '#ff7a8c', chin: '#5ecb96' };
const TIERS = {
  male:   { sub5: 'Sub-5', lt: 'LTN', mt: 'MTN', ht: 'HTN', htplus: 'HTN+ · Chadlite',   elite: 'Chad'  },
  female: { sub5: 'Sub-5', lt: 'LTB', mt: 'MTB', ht: 'HTB', htplus: 'HTB+ · Stacylite', elite: 'Stacy' }
};
let s3 = null, s3cal = null;   // s3 = latest measurement, s3cal = optional real Tr–Me height in mm

function s3Measure() {
  const d = window.lowerThirdLandmarks?.front;
  if (!d) return null;
  if (!d.meta) return { bad: true, noMesh: true };
  const rep = FA.generateReport({ mesh: d.meta.mesh, W: d.width, H: d.height, gender: gender || 'male', points: d.points, autoPoints: d.auto,
    pose: d.meta.pose, blendshapes: d.meta.blend, quality: d.meta.quality, hair: d.meta.hair });
  if (rep.bad) return { bad: true };
  const R = rep.measurements._raw, y = id => d.points[id].y, T3 = rep.measurements.facialThirds, S = rep.stomion.value;
  // compatibility fields used by the canvas drawing code
  rep.tot = R.tot; rep.stm = S;
  rep.v = { up: R.up, mid: R.mid, low: R.low, phil: y('Ls') - y('Sn'), lips: y('Li') - y('Ls'), chin: y('Me') - y('Li'), snStm: S - y('Sn'), stmMe: y('Me') - S };
  rep.pct = { up: T3.upper, mid: T3.middle, low: T3.lower }; Object.keys(rep.v).forEach(k => { rep.pct[k] = rep.v[k] / R.tot * 100; });
  rep.r = rep.measurements.lowerThird.split; rep.x = rep.v.stmMe / rep.v.snStm;
  return rep;
}

const fmtPct = n => nf(n.toFixed(1)) + '%';
const mmOf = (len, tot) => s3cal ? nf((len / tot * s3cal).toFixed(1)) + ' ' + T('s3_mm') : '';
const BANDCLS = { 'within': 'ok', 'slightly outside': 'warn', 'strong deviation': 'bad', 'n/a': 'warn' };

function renderS3() {
  s3 = s3Measure();
  const box = $('s3Report'), msg = $('s3Msg');
  msg.className = 'msg-bar'; msg.textContent = '';
  if (!s3 || s3.bad) {
    box.innerHTML = ''; $('s3DevBody').innerHTML = '';
    if (s3) { msg.className = 'msg-bar error'; msg.textContent = T(s3.noMesh ? 's3_err_nomesh' : 's3_err_order'); }
    drawS3(); return;
  }
  const m = s3, g = gender || 'male', male = g === 'male', dev = m.deviations, fs = m.featureScores, esc = v => String(v).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const fx2 = v => nf(v.toFixed(2)), fx3 = v => nf(v.toFixed(3)), xTxt = nf(m.x.toFixed(2));
  const withMm = k => fmtPct(m.pct[k]) + (s3cal ? ' · ' + mmOf(m.v[k], m.tot) : '');
  const half = key => FA.CONFIG.scoring.tolSd * dev[key].scale, c = key => dev[key].center;
  const refTxt = key => {
    const pc = key.startsWith('third'), f = pc ? (v => nf(v.toFixed(1))) : (key === 'lowerSplit' ? fx3 : fx2);
    if (dev[key].excessSd !== dev[key].excessSd) return '—';
    return dev[key].center !== undefined && FA.REFERENCE_PROFILES[g][key].oneSided ? '≤ ' + f(c(key) + half(key)) : f(c(key) - half(key)) + '–' + f(c(key) + half(key)) + (pc ? '%' : '');
  };
  const rows = [['s3_m_up', 'thirdUp', () => withMm('up')], ['s3_m_mid', 'thirdMid', () => withMm('mid')], ['s3_m_low', 'thirdLow', () => withMm('low')],
    ['s3_m_mlb', 'midLowBalance', fx3], ['s3_m_split', 'lowerSplit', () => '1 : ' + xTxt], ['s3_m_fwhr', 'fwhr', fx2], ['s3_m_jaw', 'jawWidth', fx2],
    ['s3_m_eyes', 'eyeSpacing', fx2], ['s3_m_nose', 'noseWidth', fx2], ['s3_m_mouth', 'mouthNose', fx2], ['s3_m_sym', 'symmetry', fx3]];
  const rowHtml = ([lbl, key, fn]) => { const cls = BANDCLS[dev[key].band];
    return `<tr><td>${T(lbl)}</td><td class="v">${fn(dev[key].value)}</td><td class="i">${refTxt(key)}</td><td><span class="s3-chip ${cls}">${T('s3_' + cls)}</span></td><td class="i">${nf(Math.round(fs[key].confidence * 100))}%</td></tr>`; };

  const bandOf = key => dev[key].excessSd > 0 ? (dev[key].z > 0 ? 'hi' : 'lo') : 'ok';
  const balKey = { ok: 's3_bal_ok', hi: 's3_bal_long', lo: 's3_bal_short' }[bandOf('thirdLow')];
  const splitKey = { ok: 's3_split_ok', hi: 's3_split_long', lo: 's3_split_short' }[bandOf('lowerSplit')];

  // limiting factor = largest confidence-weighted excess deviation (a low-confidence measurement can't be "the" limiter)
  const cand = rows.map(r => r[1]).filter(k => dev[k].excessSd === dev[k].excessSd && fs[k].confidence >= .45);
  const worst = cand.reduce((a, b) => (!a || dev[b].excessSd > dev[a].excessSd) ? b : a, null);
  const lbl = Object.fromEntries(rows.map(r => [r[1], r[0]])), vfn = Object.fromEntries(rows.map(r => [r[1], r[2]]));
  const limit = worst && dev[worst].excessSd >= 1
    ? T('s3_limit', { m: T(lbl[worst]), v: vfn[worst](dev[worst].value), i: refTxt(worst) }) : T('s3_limit_none');

  // fixes — only suggested when the underlying measurement is reliable AND clearly outside the reference
  const ok = k => fs[k].confidence >= .45 && dev[k].excessSd >= 1;
  const soft = [male ? 's3_soft_bf_m' : 's3_soft_bf_f', 's3_soft_posture', male ? 's3_soft_groom_m' : 's3_soft_groom_f'];
  if (ok('thirdUp') && dev.thirdUp.z > 0) soft.push('s3_soft_hair');
  const hard = [];
  if (ok('thirdLow') && dev.thirdLow.z > 0) hard.push('s3_hard_long');
  if (ok('thirdLow') && dev.thirdLow.z < 0) hard.push('s3_hard_short');
  if (ok('lowerSplit') && dev.lowerSplit.z > 0) hard.push('s3_hard_phil');
  if (!hard.length) hard.push('s3_hard_none');
  const li = a => a.map(k => `<li>${T(k)}</li>`).join('');

  const bar = [['up', S3C.up], ['mid', S3C.mid], ['low', S3C.low]]
    .map(([k, c]) => `<span style="width:${m.pct[k].toFixed(2)}%;background:${c}">${fmtPct(m.pct[k])}</span>`).join('');
  const bar2 = `<span style="width:${(m.v.snStm / m.v.low * 100).toFixed(2)}%;background:${S3C.phil}">1</span><span style="width:${(m.v.stmMe / m.v.low * 100).toFixed(2)}%;background:${S3C.chin}">${nf(m.x.toFixed(2))}</span>`;

  const o = m.overall, tn = TIERS[g], [tlo, thi] = m.tierRange;
  const lmChips = Object.entries(m.landmarks.points).map(([id, p]) => {
    const st = p.source === 'corrected' ? 'corrected' : p.source === 'estimated' ? 'estimated' : p.low ? 'low' : 'auto', cls = st === 'auto' ? 'ok' : st === 'corrected' ? 'ok' : 'warn';
    return `<span class="s3-chip ${cls}" style="margin:2px">${id} · ${T('st_' + st)} · ${nf(Math.round(p.confidence * 100))}%</span>`; }).join('');
  const stmLine = `Stm · ${T('st_estimated')} · ${nf(Math.round(m.stomion.confidence * 100))}%`;
  const warn = [...new Set(m.warnings)].map(w => `<li>${esc(w)}</li>`).join('');

  box.innerHTML = `
  <div class="s3-card">
    <div class="s3-h">${T('s3_h1')}</div>
    <table class="s3-tbl"><thead><tr><th>${T('s3_col_metric')}</th><th>${T('s3_col_value')}</th><th>${T('s3_col_ideal')}</th><th></th><th>${T('s3_col_conf')}</th></tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table>
    <div class="s3-bar-cap">Tr–N · N–Sn · Sn–Me</div><div class="s3-bar">${bar}</div>
    <div class="s3-bar-cap">Sn–Stm : Stm–Me</div><div class="s3-bar">${bar2}</div>
    <p class="s3-p dim">${T('s3_split_note')}</p>
    <p class="s3-p">${T(balKey, { lt: fmtPct(m.pct.low) })}</p>
    <p class="s3-p">${T(splitKey, { x: xTxt })}</p>
    <p class="s3-p dim">${T('s3_dim_need')}</p>
    <div class="s3-bar-cap" style="margin-top:14px">${T('s3_lm_title')}</div><div>${lmChips}<span class="s3-chip warn" style="margin:2px">${stmLine}</span></div>
  </div>
  <div class="s3-card">
    <div class="s3-h">${T('s3_h2')}</div>
    <div class="s3-tier">
      <div class="name">${tn[m.tier]}</div>
      <div class="score">${T('s3_score', { idx: nf(Math.round(o.index)), unc: nf(Math.round(o.uncertainty)) })}</div>
      <div class="score" style="margin-top:4px">${T('s3_conf', { c: T('s3_conf_' + o.confidenceLabel.toLowerCase()) + ' (' + nf(Math.round(o.confidence * 100)) + '%)' })}</div>
      ${tlo !== thi ? `<p class="desc">${T('s3_tier_border', { a: tn[tlo], b: tn[thi] })}</p>` : `<p class="desc">${T('s3_tier_' + m.tier)}</p>`}
    </div>
    <p class="s3-p" style="text-align:center">${limit}</p>
    <p class="s3-p dim" style="text-align:center">${T('s3_dim_' + (male ? 'm' : 'f'))}</p>
    <p class="s3-p dim" style="text-align:center">${T('s3_uncal')}</p>
    ${warn ? `<div class="s3-sub">${T('s3_warn_title')}</div><ul class="s3-list">${warn}</ul>` : ''}
  </div>
  <div class="s3-card">
    <div class="s3-h">${T('s3_h3')}</div>
    <div class="s3-sub">${T('s3_soft_title')}</div><ul class="s3-list">${li(soft)}</ul>
    <div class="s3-sub">${T('s3_hard_title')}</div><ul class="s3-list">${li(hard)}</ul>
  </div>`;
  renderDev(m);
  drawS3();
}

/* ── DEVELOPER / DEBUG PANEL (English only, intentionally raw) ── */
function renderDev(m) {
  const f = (v, n = 3) => typeof v === 'number' ? (isFinite(v) ? v.toFixed(n) : 'NaN') : v;
  const tbl = (head, rows) => `<table class="s3-tbl dbg"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${i ? 'i' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const P = m.pose, Q = m.quality, E = m.expression, M = m.measurements, h = window.lowerThirdLandmarks.front.meta.hair;
  const sec = (t, body) => `<div class="s3-sub">${t}</div>${body}`;
  $('s3DevBody').innerHTML =
    sec('Pose', tbl(['yaw°', 'pitch°', 'roll° (post-level)'], [[f(P.yaw, 1), f(P.pitch, 1), f(P.roll, 1)]])) +
    sec('Landmarks (final = authoritative)', tbl(['pt', 'source', 'conf', 'moved/fh', 'flags'], Object.entries(m.landmarks.points).map(([id, p]) => [id, p.source, f(p.confidence, 2), f(p.movedFh), p.flags.join('; ') || '—']))) +
    sec('Hairline', tbl(['source', 'conf', 'flags'], [[h.source, f(h.confidence, 2), h.flags.join('; ') || '—']])) +
    sec('Stomion', tbl(['source', 'conf', 'lip fraction', 'mouth open / IPD'], [[m.stomion.source, f(m.stomion.confidence, 2), f(m.stomion.fraction), f(m.stomion.mouthOpenIpd)]])) +
    sec('Expression', tbl(['known', 'smile', 'jawOpen', 'browRaise', 'squint', 'factors m/l/b/e'], [[E.known, f(E.raw.smile || 0, 2), f(E.raw.jawOpen || 0, 2), f(E.raw.browRaise || 0, 2), f(E.raw.squint || 0, 2), ['mouth', 'lower', 'brow', 'eyes'].map(k => f(E.factors[k], 2)).join(' / ')]])) +
    sec('Image quality', tbl(['score', 'size', 'blur', 'light', 'crop', 'blurVar', 'facePx'], [[f(Q.score, 2), f(Q.factors.size, 2), f(Q.factors.blur, 2), f(Q.factors.light, 2), f(Q.factors.crop, 2), f(Q.metrics.blurVar, 1), f(Q.metrics.facePx, 0)]])) +
    sec('Measurements (thirds %, ratios dimensionless)', tbl(['group', 'values'], Object.entries(M).filter(([k]) => k[0] !== '_').map(([k, v]) => [k, Object.entries(v).filter(([, x]) => typeof x === 'number').map(([a, x]) => a + '=' + f(x)).join('  ')]))) +
    sec('Reference deviations → feature scores', tbl(['feature', 'value', 'ref centre', 'scale', 'z', 'excess SD', 'sex-specific', 'kind', 'conf', 'score', 'weight'],
      Object.keys(m.deviations).map(k => { const d = m.deviations[k], s = m.featureScores[k]; return [k, f(d.value), f(d.center), f(d.scale), f(d.z, 2), f(d.excessSd, 2), d.sexSpecific, d.kind, f(s.confidence, 2), f(s.score, 2), s.weight]; }))) +
    sec('Final', tbl(['index /100', '± (heuristic)', 'overall confidence', 'label', 'reference profile'], [[f(m.overall.index, 1), f(m.overall.uncertainty, 1), f(m.overall.confidence, 2), m.overall.confidenceLabel, m.gender + ' · validated=' + m.profileMeta.validated]]));
}
$('s3Cons').addEventListener('click', async () => {
  const out = $('s3ConsOut'), d = window.lowerThirdLandmarks?.front; if (!d?.meta) return;
  out.textContent = 'running…';
  const inp = { mesh: d.meta.mesh, W: d.width, H: d.height, gender: gender || 'male', points: d.points, autoPoints: d.auto, pose: d.meta.pose, blendshapes: d.meta.blend, quality: d.meta.quality, hair: d.meta.hair };
  const a = FA.consistencyTest(inp, { trials: 40 });
  let html = `<p class="s3-p">Landmark perturbation (scale/shift/noise ≈ ${FA.CONFIG.noiseIpdFrac * 100}% IPD): index sd ${a.sdIndex.toFixed(2)}, max Δ ${a.maxIndexDelta.toFixed(2)} vs reported ±${s3.overall.uncertainty.toFixed(1)} → <b>${a.stable ? 'STABLE' : 'UNSTABLE'}</b></p>`;
  html += `<p class="s3-p dim">max feature Δ: ${Object.entries(a.maxFeatureDelta).map(([k, v]) => k + '=' + v.toFixed(3)).join('  ')}</p>`;
  try { html += await imageConsistency(); } catch (e) { html += `<p class="s3-p dim">image test failed: ${e.message}</p>`; }
  out.innerHTML = html;
});
/* Image-level perturbation: re-run MediaPipe on resized / shifted-crop / brighter / higher-contrast copies and compare the
   mesh-derived (hairline-independent) measurements. Landmark noise is covered above; this covers the detector itself. */
async function imageConsistency() {
  const img = window.lowerThirdLandmarks.front.image, lmk = await getLandmarker(); if (!lmk) return '';
  const W = img.naturalWidth, H = img.naturalHeight, clip = v => Math.max(0, Math.min(255, v));
  const variants = { base: {}, 'resize 75%': { s: .75 }, 'crop 3% + shift': { crop: .03 }, 'brightness +25': { b: 25 }, 'contrast ×1.25': { a: 1.25, b: -32 } };
  const meas = {};
  for (const [name, o] of Object.entries(variants)) {
    const s = o.s || 1, cr = o.crop || 0, sx = W * cr, sy = H * cr, cw = W - 2 * sx, chh = H - 2 * sy;
    const c = document.createElement('canvas'); c.width = Math.round(cw * s); c.height = Math.round(chh * s);
    const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, sx, sy, cw, chh, 0, 0, c.width, c.height);
    if (o.a || o.b) { const id = g.getImageData(0, 0, c.width, c.height), p = id.data; for (let i = 0; i < p.length; i += 4) for (let k = 0; k < 3; k++) p[i + k] = clip(p[i + k] * (o.a || 1) + (o.b || 0)); g.putImageData(id, 0, 0); }
    const lm = lmk.detect(c)?.faceLandmarks?.[0]; if (!lm) { meas[name] = null; continue; }
    const mesh = lm.map(p => ({ x: p.x * c.width, y: p.y * c.height })), G = FA.faceGeometry(mesh), a = FA.autoPointsFromMesh(mesh);
    const L = Object.fromEntries(Object.entries(a).map(([k, p]) => [k, { ...p, confidence: 1 }])), stm = FA.estimateStomion(L, mesh, G, FA.expressionFromBlendshapes(null));
    const M = FA.calculateMeasurements(L, mesh, G, stm);
    meas[name] = { 'mid:low': M.facialThirds.midLowBalance, split: M.lowerThird.split, fWHR: M.facialWidthHeight.fwhr, jaw: M.jaw.width, eyes: M.eyes.spacing, nose: M.nose.alarToIntercanthal, mouth: M.mouth.toNose, asym: M.symmetry.value };
  }
  const b = meas.base; if (!b) return '';
  const rows = Object.entries(meas).filter(([n]) => n !== 'base').map(([n, v]) => v ? `<tr><td>${n}</td>${Object.keys(b).map(k => `<td class="i">${(v[k] - b[k] >= 0 ? '+' : '') + (v[k] - b[k]).toFixed(3)}</td>`).join('')}</tr>` : `<tr><td>${n}</td><td colspan="8">no face detected</td></tr>`).join('');
  return `<table class="s3-tbl dbg"><thead><tr><th>Δ vs original</th>${Object.keys(b).map(k => `<th>${k}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
}

function drawS3() {
  const cv = $('s3Canvas'), d = window.lowerThirdLandmarks?.front;
  if (!d || !s3 || s3.bad) { cv.style.display = 'none'; return; }
  cv.style.display = 'block';
  const cw = Math.min($('s3Stage').clientWidth || 640, 720);
  const small = cw < 480, gut = small ? 72 : 126, iw = cw - 2 * gut, k = iw / d.width, ch = Math.round(d.height * k);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.direction = 'ltr';   // keep "33.8%" in the right order on the RTL (Arabic) page
  c.fillStyle = '#0a0a0a'; c.fillRect(0, 0, cw, ch);
  c.drawImage(d.image, gut, 0, iw, ch);
  c.fillStyle = 'rgba(0,0,0,.28)'; c.fillRect(gut, 0, iw, ch);   // dim the photo so the overlay reads cleanly

  const P = d.points, X = id => gut + P[id].x * k, Y = id => P[id].y * k;
  const fam = lang === 'ar' ? "'Tajawal','Segoe UI',Arial,sans-serif" : "'Segoe UI',Arial,sans-serif";
  const fs1 = small ? 8 : 9.5, fs2 = small ? 10 : 12.5, lh = small ? 11 : 14;
  const xL = gut - 6, xR = gut + iw + 6;
  const m = s3;

  // extension lines: landmark → ruler
  const ext = (id, xr, col) => {
    c.save(); c.setLineDash([3, 3]); c.strokeStyle = col || 'rgba(255,255,255,.45)'; c.lineWidth = .8;
    c.beginPath(); c.moveTo(X(id), Y(id)); c.lineTo(xr, Y(id)); c.stroke(); c.restore();
  };
  ['Tr', 'N', 'Sn', 'Me'].forEach(id => ext(id, xL));
  ['Sn', 'Ls', 'Li', 'Me'].forEach(id => ext(id, xR));

  // midline segments between the related dots
  const seg = (a, b, col) => { c.strokeStyle = col; c.lineWidth = 1.8; c.beginPath(); c.moveTo(X(a), Y(a)); c.lineTo(X(b), Y(b)); c.stroke(); };
  seg('Tr', 'N', S3C.up); seg('N', 'Sn', S3C.mid); seg('Sn', 'Ls', S3C.phil); seg('Ls', 'Li', S3C.lips); seg('Li', 'Me', S3C.chin);

  // rulers with labels
  function ruler(x, side, ticks, items) {
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x, ticks[0]); c.lineTo(x, ticks[ticks.length - 1]); c.stroke();
    ticks.forEach(t => { c.beginPath(); c.moveTo(x - 4, t); c.lineTo(x + 4, t); c.stroke(); });
    items.forEach(it => { c.strokeStyle = it.col; c.lineWidth = 2.6; c.beginPath(); c.moveTo(x, it.ya); c.lineTo(x, it.yb); c.stroke(); });
    const L = items.map(it => ({ it, mid: (it.ya + it.yb) / 2, y: (it.ya + it.yb) / 2, h: it.lines.length * lh + 4 }));
    for (let pass = 0; pass < 24; pass++) for (let i = 1; i < L.length; i++) {      // push overlapping labels apart
      const need = (L[i - 1].h + L[i].h) / 2, gap = L[i].y - L[i - 1].y;
      if (gap < need) { const sh = (need - gap) / 2; L[i - 1].y -= sh; L[i].y += sh; }
    }
    L.forEach(o => { o.y = clamp(o.y, o.h / 2, ch - o.h / 2); });
    const tx = side === 'L' ? x - 8 : x + 8;
    c.textAlign = side === 'L' ? 'right' : 'left'; c.textBaseline = 'middle';
    L.forEach(o => {
      if (Math.abs(o.y - o.mid) > 3) { c.strokeStyle = o.it.col; c.lineWidth = .8; c.beginPath(); c.moveTo(x, o.mid); c.lineTo(x + (side === 'L' ? -5 : 5), o.y); c.stroke(); }
      const top = o.y - (o.it.lines.length * lh) / 2 + lh / 2;
      o.it.lines.forEach((ln, j) => {
        c.font = (j === 0 ? '600 ' + fs1 : j === 1 ? '700 ' + fs2 : '500 ' + fs1) + 'px ' + fam;
        c.fillStyle = j === 0 ? o.it.col : j === 1 ? '#fff' : '#bdbdbd';
        c.fillText(ln, tx, top + j * lh);
      });
    });
  }
  const lines = (name, key) => {
    const a = [name, fmtPct(m.pct[key])]; const mm = mmOf(m.v[key], m.tot); if (mm) a.push(mm); return a;
  };
  ruler(xL, 'L', [Y('Tr'), Y('N'), Y('Sn'), Y('Me')], [
    { ya: Y('Tr'), yb: Y('N'),  col: S3C.up,  lines: lines(T('s3_l_up'), 'up') },
    { ya: Y('N'),  yb: Y('Sn'), col: S3C.mid, lines: lines(T('s3_l_mid'), 'mid') },
    { ya: Y('Sn'), yb: Y('Me'), col: S3C.low, lines: lines(T('s3_l_lower'), 'low') }
  ]);
  ruler(xR, 'R', [Y('Sn'), Y('Ls'), Y('Li'), Y('Me')], [
    { ya: Y('Sn'), yb: Y('Ls'), col: S3C.phil, lines: lines(T('s3_l_phil'), 'phil') },
    { ya: Y('Ls'), yb: Y('Li'), col: S3C.lips, lines: lines(T('s3_l_lips'), 'lips') },
    { ya: Y('Li'), yb: Y('Me'), col: S3C.chin, lines: lines(T('s3_l_chin'), 'chin') }
  ]);

  // landmark dots + estimated stomion ring
  const stmX = (X('Ls') + X('Li')) / 2;
  c.strokeStyle = '#ffc933'; c.lineWidth = 1.2; c.beginPath(); c.arc(stmX, m.stm * k, 2.6, 0, 7); c.stroke();
  ['Tr', 'N', 'Sn', 'Ls', 'Li', 'Me'].forEach(id => {
    c.fillStyle = '#fff'; c.strokeStyle = 'rgba(0,0,0,.85)'; c.lineWidth = 1;
    c.beginPath(); c.arc(X(id), Y(id), 2.5, 0, 7); c.fill(); c.stroke();
  });
}

$('s3Cal').addEventListener('input', e => {
  const n = parseFloat(e.target.value);
  s3cal = n > 0 && n < 400 ? n : null;
  renderS3();
});
$('s3Back').addEventListener('click', () => {
  $('step3').classList.remove('active');
  $('step2').classList.add('active');
  layoutStage(); renderStep2();
  scrollTo({ top: 0, behavior: 'smooth' });
});
$('s3Restart').addEventListener('click', () => location.reload());

getLandmarker();   // warm the model up while the user picks a photo
</script>
