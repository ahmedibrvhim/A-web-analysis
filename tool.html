<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mr Skull | Side Profile</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
.nav-logo .logo-mark{font-size:16px;letter-spacing:1px;white-space:nowrap}.nav-logo .logo-tag{display:block}
body.lang-ar .nav-logo .logo-mark{font-family:'Tajawal',sans-serif;font-weight:700}
.hamburger{display:none;flex-direction:column;justify-content:center;gap:5px;background:none;border:1px solid var(--blood);padding:8px 10px;cursor:pointer;margin-left:auto;flex-shrink:0}
.hamburger span{display:block;width:22px;height:2px;background:var(--blood);transition:all .3s}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}.hamburger.open span:nth-child(2){opacity:0}.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:768px){nav{flex-wrap:wrap;padding:0 14px;gap:0;height:auto;min-height:58px}.nav-logo{padding:10px 0;flex:1}.hamburger{display:flex}
.nav-links{display:none;flex-direction:column;width:100%;order:3;border-top:1px solid var(--border);padding:8px 0;gap:0}.nav-links.mobile-open{display:flex}.nav-links li{width:100%}
.nav-links a{display:block;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.04);font-size:10px;letter-spacing:3px}
.nav-right{display:none;flex-direction:column;width:100%;order:4;padding:10px 0 14px;gap:8px;border-top:1px solid var(--border)}.nav-right.mobile-open{display:flex}
.btn-ghost{width:100%;text-align:center;justify-content:center}.user-pill{flex-wrap:wrap;width:100%;gap:8px}}

#toolWrap{max-width:720px;margin:0 auto;padding:34px 20px 100px}
.tool-eyebrow{font-size:9px;letter-spacing:5px;color:var(--blood);text-transform:uppercase;text-align:center;margin-bottom:10px}
.tool-title{font-family:'Cinzel Decorative',cursive;font-size:clamp(20px,3.6vw,28px);color:var(--white);letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:14px}
body.lang-ar .tool-title,body.lang-ar .tool-eyebrow{font-family:'Tajawal',sans-serif;letter-spacing:0;text-transform:none}
.tool-text{font-size:12px;color:var(--text);line-height:1.9;text-align:center;max-width:480px;margin:0 auto 26px}
.tool-step{display:none}.tool-step.active{display:block;animation:stepIn .45s ease}
@keyframes stepIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tool-nav{display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap}.tool-nav button:disabled{opacity:.35;pointer-events:none}
.msg-bar{padding:11px 16px;font-size:10px;letter-spacing:1px;text-align:center;margin-bottom:18px;border:1px solid transparent;display:none}
.msg-bar.error{display:block;background:rgba(220,20,60,.08);border-color:var(--blood);color:#ff8080}
.gender-box{margin-bottom:22px;text-align:center}.gb-title{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--white);margin-bottom:8px}
.gb-text{font-size:11px;line-height:1.8;color:var(--text);max-width:440px;margin:0 auto 16px}
.gender-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:380px;margin:0 auto}
.gender-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px 14px;background:var(--panel);border:1px solid var(--border);color:var(--text);cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:2px;transition:all .25s}
.gender-btn .sym{font-size:30px;line-height:1;color:var(--ash)}.gender-btn:hover{border-color:var(--blood)}
.gender-btn.on{border-color:var(--crimson);background:rgba(139,0,0,.18);color:var(--white);box-shadow:0 0 16px rgba(220,20,60,.25)}.gender-btn.on .sym{color:var(--crimson)}
.lock-hint{text-align:center;font-size:10px;letter-spacing:1px;color:var(--ash);margin:-8px 0 14px}
.uploader{border:1.5px dashed var(--smoke);background:var(--panel);padding:54px 24px;text-align:center;cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center}
.uploader:hover,.uploader.drag{border-color:var(--blood);background:rgba(139,0,0,.07)}.uploader.locked{opacity:.35;pointer-events:none;filter:grayscale(1)}
.uploader input{display:none}.uploader-icon{width:64px;height:64px;border-radius:50%;margin-bottom:18px;display:flex;align-items:center;justify-content:center;background:rgba(139,0,0,.1);border:1px solid var(--smoke)}
.uploader-icon svg{width:26px;height:26px;color:var(--crimson)}.uploader-cta{font-size:11px;letter-spacing:1px;color:var(--text);line-height:1.7}
.browse-word{color:var(--crimson);text-decoration:underline;text-underline-offset:3px}
.upload-preview{border:1px solid var(--border);background:var(--panel);overflow:hidden}
.upload-preview-img-wrap{width:100%;max-height:440px;background:#000;display:flex;justify-content:center}.upload-preview-img-wrap img{max-width:100%;max-height:440px;object-fit:contain}
.upload-preview-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--border)}
.upload-preview-name{font-size:9px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.tool-hint{text-align:center;font-size:10px;line-height:1.8;color:var(--ash);margin-top:14px}

.verdict{margin-top:18px;border:1px solid var(--border);background:var(--panel);padding:18px;text-align:left}
.verdict.ok{border-color:#0a5;background:rgba(0,160,90,.05)}.verdict.warn{border-color:#8a6d00;background:rgba(255,201,51,.05)}.verdict.bad{border-color:var(--blood);background:rgba(220,20,60,.06)}
.verdict-head{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}.verdict.ok .verdict-head{color:#5ecb96}.verdict.warn .verdict-head{color:#ffc933}.verdict.bad .verdict-head{color:#ff8080}
.verdict p{font-size:11px;line-height:1.8;color:var(--text)}
.verdict-loading{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.mini-spinner{width:20px;height:20px;border:2px solid var(--smoke);border-top-color:var(--blood);border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0}@keyframes spin{to{transform:rotate(360deg)}}
#lmLoupe{position:absolute;top:8px;left:8px;width:112px;height:112px;border:2px solid var(--crimson);border-radius:50%;background:#000;pointer-events:none;box-shadow:0 2px 14px rgba(0,0,0,.75);display:none;z-index:3}
.lm-stage{position:relative;background:#000;border:1px solid var(--border);display:flex;justify-content:center;overflow:hidden}
.lm-stage #lmCanvas,.lm-stage #s3Canvas{display:block;max-width:none}.lm-stage #lmCanvas{cursor:crosshair;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#step2{touch-action:manipulation}#step2 button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.lm-chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0;direction:ltr}
.lm-chip{position:relative;padding:11px 2px;font-size:13px;font-weight:700;text-align:center;color:var(--text);background:var(--panel);border:1px solid var(--border);cursor:pointer;font-family:inherit}
.lm-chip.sel{border-color:var(--crimson);background:rgba(139,0,0,.16);color:var(--white);box-shadow:0 0 14px rgba(220,20,60,.25)}
.lm-chip.seen::after{content:'';position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:#5ecb96}
.lm-name{text-align:center;font-size:11px;letter-spacing:1px;color:var(--white);font-weight:700;margin:14px 0 0}
.lm-desc{min-height:3.2em;margin:4px auto 12px;max-width:460px;text-align:center;font-size:11px;line-height:1.8;color:var(--bone)}
.lm-dash{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px;padding:20px 16px;border:1px solid var(--border);background:var(--panel);direction:ltr}
.lm-cap{font-size:8px;letter-spacing:2px;color:var(--ash);text-transform:uppercase;margin-bottom:6px}
.lm-pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:5px}
.lm-pad button{display:flex;align-items:center;justify-content:center;background:rgba(139,0,0,.12);border:1px solid var(--smoke);color:var(--crimson);cursor:pointer;touch-action:manipulation;user-select:none}
.lm-pad button:active,.lm-pad button.hold{background:var(--blood);color:var(--white);border-color:var(--crimson)}.lm-pad svg{width:20px;height:20px}
.lm-pad .c{display:flex;align-items:center;justify-content:center}.lm-pad .c i{width:5px;height:5px;border-radius:50%;background:var(--smoke)}
.lm-side{display:flex;flex-direction:column;gap:14px;min-width:150px}
.lm-seg{display:flex;border:1px solid var(--smoke)}.lm-seg button{flex:1;padding:8px 6px;font-size:9px;letter-spacing:1px;background:none;border:0;color:var(--ash);cursor:pointer;font-family:inherit}
.lm-seg button+button{border-inline-start:1px solid var(--smoke)}.lm-seg button.on{background:var(--blood);color:var(--white)}
.lm-progress{text-align:center;font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:16px;text-transform:uppercase}

.s3-card{margin-top:16px;padding:18px;border:1px solid var(--border);background:var(--panel)}
.s3-h{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--white);margin-bottom:12px}
.s3-p{font-size:11px;line-height:1.85;color:var(--text);margin:10px 0 0}
.s3-rate{text-align:center;background:radial-gradient(ellipse at top,rgba(139,0,0,.18),var(--panel) 70%)}
.rot-name{font-family:'Cinzel Decorative',cursive;font-size:clamp(26px,6vw,38px);letter-spacing:3px}
body.lang-ar .rot-name{font-family:'Tajawal',sans-serif;font-weight:900;letter-spacing:0}
.rot-sub{font-size:11px;letter-spacing:2px;color:var(--white);margin-top:6px}
.gauge{position:relative;height:10px;margin:26px 6px 8px;border-radius:5px;direction:ltr;background:linear-gradient(90deg,#5ecbff,#6ee7b7 25%,#cfcfcf 50%,#ff9a4c 75%,#ff5555)}
.gauge::before,.gauge::after{content:'';position:absolute;top:-4px;bottom:-4px;width:1px;background:rgba(255,255,255,.35)}.gauge::before{left:38.9%}.gauge::after{left:61.1%}
.gauge i{position:absolute;top:-7px;width:4px;height:24px;margin-left:-2px;background:#fff;box-shadow:0 0 10px #000,0 0 8px #fff}
.gauge-lbl{display:flex;justify-content:space-between;font-size:8px;letter-spacing:1px;color:var(--ash);text-transform:uppercase;direction:ltr}
.stats{display:flex;justify-content:center;gap:10px;margin:18px 0 4px;flex-wrap:wrap}
.stats div{min-width:120px;padding:9px 10px;border:1px solid var(--border);background:rgba(0,0,0,.35);display:flex;flex-direction:column;gap:3px}
.stats b{font-size:15px;color:var(--white);direction:ltr}.stats span{font-size:8px;letter-spacing:1px;color:var(--ash);text-transform:uppercase}
.desc{font-size:11px;line-height:1.9;color:var(--bone);max-width:470px;margin:14px auto 0}
.s3-disc{text-align:center;font-size:9px;line-height:1.8;color:var(--ash);max-width:480px;margin:16px auto 0}
.skull-card{display:flex;flex-direction:column;text-align:center;gap:12px;align-items:center;padding:14px;border:1px solid var(--border);background:var(--panel)}
.skull-wrap{cursor:pointer;position:relative;flex:none;width:130px;height:130px;border-radius:50%;overflow:hidden;background:#000;border:2px solid var(--blood);box-shadow:0 0 22px rgba(139,0,0,.35)}
.skull-wrap.speaking{box-shadow:0 0 34px rgba(220,20,60,.75)}
.sk-up,.sk-jaw{position:absolute;inset:0;background:url(Skull.png) center/cover}
.sk-up{clip-path:polygon(0 0,100% 0,100% 100%,74% 100%,74% 76%,28% 76%,28% 100%,0 100%)}
.sk-jaw{clip-path:polygon(28% 76%,74% 76%,74% 100%,28% 100%);will-change:transform}
.skull-bubble{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}#skText{font-size:12px;line-height:1.85;color:var(--bone);min-height:5.5em}
.skull-bubble .btn-ghost{width:auto;align-self:center;padding:8px 16px}.skull-bubble{width:100%}#skText{text-align:start}
.s3-stack{display:flex;flex-direction:column;gap:14px;margin-top:16px}.s3-stack .s3-card{margin-top:0}
.tier-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:ltr}
.tier-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 10px 16px;border:1px solid var(--c);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.35));box-shadow:inset 0 0 26px color-mix(in srgb,var(--c) 18%,transparent),0 0 18px color-mix(in srgb,var(--c) 22%,transparent)}
.tier-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c)}
.tier-box.pot{border-style:dashed}
.tier-cap{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--ash)}
.tier-name{font-family:'Cinzel Decorative',cursive;font-size:clamp(24px,7vw,38px);letter-spacing:2px;color:var(--c);text-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent);line-height:1.1;text-align:center}
body.lang-ar .tier-name{font-family:'Tajawal',sans-serif;font-weight:900;letter-spacing:0}
body.lang-ar .tier-cap{letter-spacing:0;text-transform:none}
.tier-score{font-size:11px;letter-spacing:2px;color:var(--white)}
.s3-review{display:none;justify-content:center;margin-top:18px}.s3-review .btn-solid{min-width:240px}
.s3-modal{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.94);display:none;overflow:auto;padding:20px 16px}
.s3-modal.open{display:flex;flex-direction:column;align-items:center;gap:16px}
.s3-modal .lm-stage{max-width:100%}
@media(max-width:520px){.lm-chip{font-size:11px}#skText{font-size:11px}}
.auth-gate{position:fixed;inset:0;z-index:9999;background:radial-gradient(ellipse at center,#150000 0%,#000 70%);display:flex;align-items:center;justify-content:center;transition:opacity .3s,visibility .3s}
.auth-gate.auth-gate-hidden{opacity:0;visibility:hidden;pointer-events:none}.auth-gate-inner{text-align:center}
.auth-gate-skull{width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid var(--blood);box-shadow:0 0 30px rgba(139,0,0,.4);margin:0 auto 16px;display:block}
.auth-gate-text{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.photo-tip{margin:0 0 16px;padding:14px 16px;border:1px solid var(--blood);background:rgba(139,0,0,.1);text-align:center}
.photo-tip p{font-size:11px;line-height:1.8;color:var(--bone);margin:0 0 10px}
.tip-pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tip-pill{font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:5px 12px;border:1px solid var(--crimson);color:var(--white)}
body.lang-ar .tip-pill{letter-spacing:0;text-transform:none}
.ref-title{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--white);text-align:center;margin:0 0 16px}
body.lang-ar .ref-title{letter-spacing:0;text-transform:none}
.ref-fig{max-width:360px;margin:0 auto 18px;border:1px solid var(--border);background:#efeee9;padding:8px}.ref-fig svg{display:block;width:100%;height:auto}
.ref-list{display:grid;gap:8px}
.ref-row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);background:var(--panel)}
.ref-id{flex:none;min-width:36px;padding:5px 0;text-align:center;font-weight:700;font-size:12px;color:var(--white);background:rgba(139,0,0,.3);border:1px solid var(--blood);direction:ltr}
.ref-row b{display:block;font-size:11px;color:var(--white);letter-spacing:.5px;margin-bottom:2px}
.ref-row .d{font-size:11px;line-height:1.7;color:var(--text)}
.lm-guide{display:flex;gap:14px;align-items:center;padding:12px;margin-bottom:12px;border:1px solid var(--border);background:var(--panel)}
.lm-mini{flex:none;width:104px;background:#efeee9;padding:4px;border:1px solid var(--border)}.lm-mini svg{display:block;width:100%;height:auto}
.lm-gtxt{flex:1;min-width:0}.lm-gtxt .lm-name{text-align:start;margin:0}.lm-gtxt .lm-desc{text-align:start;margin:4px 0 0;min-height:0;max-width:none}
.lm-tip{text-align:center;font-size:10px;color:var(--ash);margin:8px 0 0;line-height:1.7}
.rs-list{list-style:none;margin:10px 0 0;padding:0;text-align:start}.rs-list li{font-size:11px;line-height:1.7;color:var(--text);padding:6px 0 6px 12px;border-top:1px solid rgba(255,255,255,.07);position:relative}
.rs-list li::before{content:'';position:absolute;left:0;top:13px;width:5px;height:5px;border-radius:50%;background:#ff9a4c}.rs-list li.bad::before{background:#ff5555}
.verdict .rs-list li{color:inherit}
.ruler{position:relative;height:10px;margin:26px 6px 6px;border-radius:5px;direction:ltr;background:rgba(255,255,255,.14)}
.ruler s{position:absolute;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.35)}
.ruler i{position:absolute;top:-7px;width:4px;height:24px;margin-left:-2px;background:#fff;box-shadow:0 0 10px #000,0 0 8px #fff}
.ruler .ruler-band{position:absolute;top:0;bottom:0;background:rgba(255,201,51,.45);border-radius:5px}
.ruler-lbl{display:flex;justify-content:space-between;font-size:8px;letter-spacing:1px;color:var(--ash);direction:ltr}
.lm-tbl{width:100%;border-collapse:collapse;font-size:11px;direction:ltr;text-align:start}.lm-tbl th{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--ash);font-weight:400;padding:4px 6px;text-align:start}
.lm-tbl td{padding:5px 6px;border-top:1px solid rgba(255,255,255,.07);color:var(--text)}.lm-tbl td.ok{color:#5ecb96}.lm-tbl td.warn{color:#ff9a4c}.lm-tbl td.bad{color:#ff5555}
.lm-ack{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:11px;line-height:1.7;color:var(--bone);cursor:pointer}.lm-ack input{margin-top:4px;flex:none}
#lmCheck{margin-top:14px;padding:12px;border:1px solid var(--border);background:var(--panel)}
.exp-banner{display:inline-block;margin-bottom:10px;padding:4px 10px;font-size:9px;letter-spacing:2px;border:1px dashed #ff9a4c;color:#ff9a4c}
#lmSugg{width:auto;padding:8px 10px;font-size:10px}
</style>
</head>
<body>
<div id="authGate" class="auth-gate"><div class="auth-gate-inner"><img src="Skull.png" alt="" class="auth-gate-skull"><div class="auth-gate-text" data-i18n="auth_gate_checking">Checking your session…</div></div></div>

<nav>
  <a class="nav-logo" href="index.html"><img src="Skull.png" alt="Mr Skull"><div><div class="logo-mark" data-i18n="brand_name">Mr Skull</div><div class="logo-tag" data-i18n="brand_tag">Face Analysis</div></div></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="index.html" data-i18n="nav_home">Home</a></li>
    <li><a href="tool.html" class="active" data-i18n="nav_tool">Analysis</a></li>

    <button class="nav-lang" id="navLang" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span><span class="lang-cur" id="langCur">EN</span> <span class="lang-sep">/</span> <span id="langOther">AR</span></span></button>
  </div>
</nav>

<div class="page-wrap"><div id="toolWrap">
  <div class="msg-bar" id="toolMsg"></div>

  <section class="tool-step active" id="step1">
    <div class="gender-box">
      <div class="gb-title" data-i18n="g_title">Select Your Gender</div>
      <p class="gb-text" data-i18n="g_text"></p>
      <div class="gender-opts">
        <button type="button" class="gender-btn" data-g="male"><span class="sym">♂</span><span data-i18n="g_male">Male</span></button>
        <button type="button" class="gender-btn" data-g="female"><span class="sym">♀</span><span data-i18n="g_female">Female</span></button>
      </div>
    </div>
    <p class="lock-hint" id="lockHint" data-i18n="g_locked"></p>
    <div class="photo-tip" id="photoTip"></div>
    <label class="uploader locked" id="uploader">
      <input type="file" accept="image/*" id="fileInput" disabled>
      <span class="uploader-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span>
      <p class="uploader-cta" id="uploaderCta"></p>
    </label>
